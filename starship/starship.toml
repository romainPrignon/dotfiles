"$schema" = 'https://starship.rs/config-schema.json'

format = """
$character\
$username\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$cmd_duration """

[character]
success_symbol = "[✔](green)"
error_symbol = "[✘](red)"

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold cyan"

[directory]
truncation_length = 2
truncation_symbol = ".../"
truncate_to_repo = false
format = "[ $path]($style)"
style = "bold yellow"

[git_branch]
format = '[ \[$branch]($style)'
style = "white"
only_attached = true

[git_commit]
format = '[ \[$hash]($style)'
style = "white"
only_detached = true
commit_hash_length = 7

[git_status]
format = '[$ahead_behind$conflicted$staged$modified$untracked\]]($style)'
style = "white"
ahead = " [↑·${count}](bright-white)"
behind = " [↓·${count}](bright-white)"
diverged = " [↑·${ahead_count} ↓·${behind_count}](bright-white)"
up_to_date = " [√](bold bright-green)"

conflicted = " [✖](bold bright-red)$count"
untracked = " ​[…](bold bright-cyan)$count"
modified = " [±](bold bright-blue)$count"
staged = " [​•](bold bright-green)$count"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "white"

[cmd_duration]
min_time = 15000
format = "[ $duration]($style)"
style = "dimmed white"
